<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terms & Conditions - Casa Vergara Resort</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css?v=20261004f" rel="stylesheet">
  <link href="../css/polish.css?v=20260830i" rel="stylesheet">
</head>
<body>
  <div id="site-navbar"></div>

  <section class="section-pad">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="mb-4">
            <span class="text-uppercase text-secondary fw-bold small">Legal</span>
          </div>

          <ul class="nav nav-pills mb-4 cvr-legal-tabs" id="cvrTermsTabs">
            <li class="nav-item">
              <button type="button" class="nav-link active" data-doc-type="room">Room Bookings</button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" data-doc-type="event">Event Bookings</button>
            </li>
          </ul>

          <div id="cvrLegalDoc"></div>

          <p class="text-center text-muted-brand small mt-4">
            Looking for our <a href="privacy.html">Privacy Policy</a> instead?
          </p>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js?v=20260925a"></script>
  <script src="../js/legal-doc.js?v=20260830i"></script>
  <script>
    renderNavbar("");
    renderFooter();

    function loadTermsTab(type) {
      cvrLoadLegalDoc(type, "cvrLegalDoc");
    }

    document.getElementById("cvrTermsTabs")?.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-doc-type]");
      if (!btn) return;
      document.querySelectorAll("#cvrTermsTabs .nav-link").forEach((el) => el.classList.remove("active"));
      btn.classList.add("active");
      loadTermsTab(btn.getAttribute("data-doc-type"));
    });

    const requestedType = new URLSearchParams(window.location.search).get("type");
    const initialType = requestedType === "event" ? "event" : "room";
    document.querySelectorAll("#cvrTermsTabs .nav-link").forEach((el) => {
      el.classList.toggle("active", el.getAttribute("data-doc-type") === initialType);
    });
    loadTermsTab(initialType);
  </script>
</body>
</html>
